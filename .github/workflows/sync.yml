name: Sync LocumBay Shifts to Calendar

on:
  schedule:
    # Run automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch shifts from LocumBay and build ICS calendar
        env:
          LOCUMBAY_EMAIL: ${{ secrets.LOCUMBAY_EMAIL }}
          LOCUMBAY_PASSWORD: ${{ secrets.LOCUMBAY_PASSWORD }}
          SECRET_FEED_KEY: ${{ secrets.SECRET_FEED_KEY }}
        run: |
          python sync_shifts.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
